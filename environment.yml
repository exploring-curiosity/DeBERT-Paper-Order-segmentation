name: l2labs
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - pip
  - pytorch::pytorch>=2.0
  - pytorch::torchvision
  - pytorch::pytorch-cuda=12.1
  - tesseract
  - pip:
      - transformers>=4.35.0
      - accelerate>=0.24.0
      - sentencepiece>=0.1.99
      - pymupdf>=1.23.0
      - pdfplumber>=0.10.0
      - pytesseract>=0.3.10
      - scikit-learn>=1.3.0
      - pandas>=2.0.0
      - numpy>=1.24.0
      - pillow>=10.0.0
      - tqdm>=4.65.0
